name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The plugin has no runtime dependencies; tests use a local mock for
      # @deepseek-ai/dsh-tools, so no install step is required.
      - name: mock-host smoke checks
        run: npm test
      - name: pack tarball
        run: npm run pack -- --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/*.tgz
